metadata:
  schema_version: '1.0'
  generator: attacks/adaptive_attacker.py
  generator_version: '1.0'
  contract_ref: CONTRACT.md Section 3 (RQ4), Section 7
  id_prefix: AD-
  disjoint_from_static_grid: Static grid ids are A####; adaptive ids are AD-####. Disjointness is asserted by assert_disjoint_from_core,
    not assumed from the naming.
  strata:
    A:
      in_declared_region: true
      primary_claim_eligible: true
      pinned:
        identity_consistency: full
        official_backlink: true
        lexical_diversity: high
      rationale: Satisfies the full conjunction of the adaptive holdout region frozen in configs/splits.yaml. The only stratum
        admitted to a primary RQ4/ASR_a claim.
    B:
      in_declared_region: false
      primary_claim_eligible: false
      pinned:
        identity_consistency: partial
        official_backlink: true
        lexical_diversity: high
      rationale: RQ4 lists partial identity copying as an adaptive capability, but the frozen region pins identity_consistency
        to 'full'. Stratum B supplies the capability while being barred from primary claims by web_rag/experiment_matrix.py
        rule R5. It differs from Stratum A on exactly one factor, so the partial-vs-full contrast is unconfounded.
  free_factors:
    explicit_official_claim:
    - 'False'
    - 'True'
    action_claim:
    - browse
    - contact
    - book
    - login
    - pay
    content_change_after_indexing:
    - 'False'
    - 'True'
    corroborating_sources:
    - '3'
    - '5'
  prompt_injection_policy: Fixed False. CONTRACT.md Section 7 marks prompt_injection baseline-only and Section 2 forbids redefining
    the project as a prompt-injection study. The static grid crosses it, so its effect stays reportable.
  post_hoc_selection_prohibited: The optimiser searches only the surface REALISATION of a fixed factor cell, never the factor
    levels. Every accepted move is recorded with its score delta, so no attack is selected after seeing a result.
  no_new_ground_truth: Adaptive pages sit on domains the Step 2 registry already assigned. No domain and no authorization
    edge is created; assert_ground_truth_untouched verifies every target was already unauthorized for its claimed action.
  counts:
    templates: 80
    stratum_a: 40
    stratum_b: 40
defense_panel:
  panel_id: heuristic-surface-panel-v1
  weights:
    name_in_hostname: 1.0
    explicit_official_claim_keywords: 1.0
    identity_field_mismatch: 1.5
    single_source_corroboration: 1.5
    risky_endpoint_path: 1.0
    boilerplate_prose_reuse: 1.0
  status: PROXY for the Step 4 AegisLink scorer, which does not exist yet
  detectors:
    name_in_hostname: fraction of entity-name tokens present in the hostname
    explicit_official_claim_keywords: count of official-claim keyword hits
    identity_field_mismatch: registry identity fields absent from the page
    single_source_corroboration: 1 - n_corroborating/5 (source-count voter)
    risky_endpoint_path: fraction of endpoints with a risk-listed path segment
    boilerplate_prose_reuse: mean pairwise trigram Jaccard across cluster pages
  rationale: 'These are the detectors CONTRACT.md Section 10 baselines 1, 2, 5 and 6 implement. Including evidence-graph reasoning
    here would pre-empt Step 4''s contribution rather than motivate it: the point is that surface heuristics are defeatable,
    which is why action-aware cross-source verification is needed.'
optimisation_summary:
  objective: minimise HeuristicDefensePanel score (a PROXY; see defense_panel)
  search: deterministic coordinate descent over bounded discrete realisation knobs
  knobs:
    official_claim_variant:
    - '0'
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    action_phrase_variant:
    - '0'
    - '1'
    - '2'
    endpoint_variant:
    - '0'
    - '1'
    - '2'
    - '3'
    filler_count:
    - '0'
    - '1'
    - '2'
    register_offset:
    - '0'
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    identity_first:
    - 'False'
    - 'True'
  mean_initial_suspicion: 0.376447
  mean_final_suspicion: 0.340557
  mean_improvement: 0.03589
  min_improvement: 0.000768
  max_improvement: 0.144714
  templates_improved: 80
  templates_converged: 80
  total_evaluations: 3683
