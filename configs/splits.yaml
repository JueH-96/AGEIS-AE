metadata:
  schema_version: '1.0'
  builder: registry/split_builder.py
  builder_version: '1.0'
  master_seed: 42
  contract_ref: CONTRACT.md Section 5.3
  preregistration_ref: preregistration.yaml -> splits
  split_unit:
  - entity_template
  - site_template
  - attack_template
  split_unit_note: Splitting is by template, never by rendered page. Two entities instantiated from one
    entity template therefore always land in the same split, which is what stops a page-level split from
    leaking a memorised template.
  fraction_denominator: The 50/20/30 fractions apply to each axis's CORE pool, i.e. the templates remaining
    after the mandated holdouts are removed. CONTRACT.md Section 5.3 lists the adaptive and transfer holdouts
    alongside the three fractions and characterises them by disjointness rather than by a share, so including
    them in the denominator would make the stated fractions unachievable.
  threshold_selection_constraint: No test template may be used during threshold selection (CONTRACT.md
    Section 5.3). Gate decisions and threshold fitting use train_development and validation only.
policy:
  fractions:
    train_development: 0.5
    validation: 0.2
    test: 0.3
  regimes:
  - train_development
  - validation
  - test
  - transfer_holdout
  - adaptive_holdout
  - fabricated_control
  regime_admission_rule: A rendered page belongs to regime R iff its entity template is in R's entity
    pool AND its site template is in R's site pool AND its attack template is either absent (benign page)
    or in R's attack pool. Independent per-axis splitting means a triple mixing pools from different regimes
    belongs to no regime and must never be rendered.
  transfer_holdout_categories:
  - fitness_studio
  - bookshop
  transfer_holdout_rationale: Whole entity categories are withheld, so the unseen-entity-template gate
    tests transfer to a category the defense never saw rather than to a sibling template of one it did.
  adaptive_holdout_region:
    identity_consistency:
    - full
    official_backlink:
    - 'True'
    corroborating_sources:
    - '3'
    - '5'
    lexical_diversity:
    - high
  adaptive_holdout_rationale: A pre-declared factor-level region (the strongest attacks), fixed before
    any result existed. Randomly held-out cells of one grid would each have a trained near neighbour,
    making the unseen-attack-template gate close to vacuous.
  adaptive_holdout_cost: 'Excising a factor-level region skews the ELIGIBLE pool for identity_consistency,
    official_backlink, corroborating_sources and lexical_diversity. Whether that skew propagates into
    the SELECTED core fraction was checked rather than assumed: the per-factor quotas remained satisfiable
    after the exclusion, so the selected core fraction is exactly uniform on every main effect. The achieved
    marginals for both the core pool and the holdout are recorded under axes.attack_template.achieved_factor_marginals
    so this can be verified rather than taken on trust. The holdout pool itself is deliberately non-uniform
    -- that is what makes it the strongest-attack region.'
