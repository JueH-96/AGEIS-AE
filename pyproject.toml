[project]
name = "aegislink-ae-check"
version = "1.0.0"
description = "AegisLink artifact-evaluation bundle: one-click experiment reproduction, Excel export, figures, tests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "aegislink", "attacks", "baselines", "web_rag", "registry",
    "site_generator", "parsers", "evaluation", "statistics",
]
