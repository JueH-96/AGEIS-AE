limitations:
- 'Overlap scoring is lexical: it detects concepts present in a title and abstract. A paper whose full
  text contains an action-level authorization defense that its abstract never mentions would be under-scored.
  Section 13 therefore requires re-running this check at all four checkpoints, and any near_collision
  entry is flagged for full-text differentiation.'
- Web search coverage is not exhaustive. A NO_DIRECT_COLLISION verdict is evidence of no detected collision,
  not proof that none exists.
- 0 of 8 cited identifiers did not resolve against the live arXiv API and are scored at evidence tier
  2 from the contract's own characterization. Their non-collision status is provisional.
- 1 of 8 cited identifiers resolve to a title that does not match the CONTRACT.md Section 20 citation
  (P07). Scores for those records describe the retrieved paper, not necessarily the intended one.
- Scoring text is the union of the retrieved title, the retrieved abstract, and the contract's own characterization
  of the paper. The union is used because under-detecting a collision would produce a false novelty claim;
  each record's scored_text_sources field states which components were present.
